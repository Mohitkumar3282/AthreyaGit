# ==============================================================================
# Production Nginx Configuration for athreyadelivery.com
# File Location: /etc/nginx/sites-available/athreyadelivery.conf
# ==============================================================================

upstream backend_nodes {
    server 127.0.0.1:7000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name athreyadelivery.com www.athreyadelivery.com;

    # Maximum file upload size (matches backend limit)
    client_max_body_size 50M;

    # Frontend build directory
    root /root/athreya/frontend/dist;
    index index.html;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. API Reverse Proxy -> http://athreyadelivery.com/api
    location /api {
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 2. Socket.IO Real-time WebSockets -> http://athreyadelivery.com/socket.io/
    location /socket.io {
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Backend Health & Readiness Checks
    location /health {
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ready {
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Vite Static Assets (Cache for 1 year)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # 5. Frontend Single Page Application (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
